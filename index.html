<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiet Company</title>
  <meta name="description" content="A quiet companion for breathing sessions.">
  <meta name="theme-color" content="#0d1116">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quiet Company">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="stage" aria-hidden="true"></div>
  <div class="scrim scrim-top" aria-hidden="true"></div>
  <div class="scrim scrim-bottom" aria-hidden="true"></div>

  <section id="home" class="home" aria-label="Choose a scene">
    <!-- Text label, not a gear icon: SVG icons failed to render on this
         app twice in a row (v9/v10) for reasons never pinned down. -->
    <button id="settings-open" class="pill subtle home-settings">Settings</button>
    <header class="home-header">
      <p class="home-eyebrow">A Meditation Timer</p>
      <h1 class="home-brand">Quiet Company</h1>
      <p class="home-tagline">Choose who sits with you.</p>
    </header>
    <div id="card-grid" class="card-grid"></div>
    <footer class="home-foot">
      <div id="version" class="version" aria-hidden="true"></div>
    </footer>
  </section>

  <main id="ui" class="state-browse">
    <header class="top">
      <button id="to-home" class="pill subtle home-btn">&#8249; Scenes</button>
      <button id="mute" class="pill mute-toggle" aria-pressed="false">Sound</button>
    </header>

    <button id="nav-prev" class="nav-arrow prev" aria-label="Previous scene">&#8249;</button>
    <button id="nav-next" class="nav-arrow next" aria-label="Next scene">&#8250;</button>

    <div class="panels">

      <section id="browse" class="panel visible" aria-label="Choose a scene">
        <div id="dots" class="dots" role="tablist" aria-label="Scenes"></div>
        <h2 id="scene-name" class="scene-name">Temple</h2>
        <button id="choose" class="pill cta">Begin</button>
      </section>

      <section id="setup" class="panel" aria-label="Session length">
        <p class="prompt">How long would you like to sit?</p>
        <div id="durations" class="durations" role="group" aria-label="Session length">
          <button class="pill duration" data-minutes="5">5 min</button>
          <button class="pill duration" data-minutes="10">10 min</button>
          <button class="pill duration" data-minutes="15">15 min</button>
          <button class="pill duration" data-minutes="custom">Custom</button>
          <button class="pill duration" data-minutes="open">Open</button>
        </div>
        <div id="custom-row" class="custom-row">
          <button id="custom-minus" class="step" aria-label="One minute less">&minus;</button>
          <span id="custom-value" class="custom-value">20 min</span>
          <button id="custom-plus" class="step" aria-label="One minute more">+</button>
        </div>
        <div id="sound" class="sound-section">
          <p class="prompt-sub">Sound</p>
          <div class="sound-rows">
            <label id="ambience-field" class="select-field hidden">
              <span class="select-label">Ambience</span>
              <select id="ambience-select">
                <option value="off">Off</option>
                <option value="on">On</option>
              </select>
            </label>
            <label class="select-field">
              <span class="select-label">Music</span>
              <select id="music-select"></select>
            </label>
          </div>
          <p class="music-credit">Music by Scott Buckley &mdash; CC BY 4.0</p>
        </div>
        <div class="setup-actions">
          <button id="back" class="pill subtle">Back</button>
          <button id="begin" class="pill cta">Start</button>
        </div>
      </section>

      <section id="session" class="panel" aria-label="Session in progress">
        <div id="countdown" class="countdown" role="timer" aria-live="off">10:00</div>
        <div class="session-controls">
          <button id="pause" class="pill">Pause</button>
          <button id="end" class="pill subtle">End</button>
          <button id="sound-open" class="pill subtle">Sound</button>
        </div>
        <button id="gag" class="pill subtle gag-btn hidden">Gag</button>
      </section>

      <section id="complete" class="panel" aria-label="Session complete">
        <p class="complete-msg">Session complete</p>
        <button id="again" class="pill cta">Sit again</button>
      </section>

    </div>
  </main>

  <!-- Sheets sit above every screen. Settings holds app-wide preferences
       set once; the sound sheet holds this session's audio, mirroring the
       setup screen's controls so a track can change mid-session. -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

  <section id="settings-sheet" class="sheet" role="dialog" aria-modal="true"
           aria-label="Settings" hidden>
    <h2 class="sheet-title">Settings</h2>

    <label class="sheet-row">
      <span class="sheet-label">Countdown</span>
      <span class="select-shell">
        <select id="countdown-select">
          <option value="always">Always shown</option>
          <option value="rest">Tap to check</option>
          <option value="never">Never</option>
        </select>
      </span>
    </label>
    <p class="sheet-note" id="countdown-note"></p>

    <label class="sheet-row">
      <span class="sheet-label">Interval bells</span>
      <span class="select-shell">
        <select id="bells-select">
          <option value="0">Off</option>
          <option value="1">Every minute</option>
          <option value="2">Every 2 minutes</option>
          <option value="3">Every 3 minutes</option>
          <option value="5">Every 5 minutes</option>
          <option value="10">Every 10 minutes</option>
          <option value="15">Every 15 minutes</option>
        </select>
      </span>
    </label>

    <label class="sheet-row">
      <span class="sheet-label">Settle time</span>
      <span class="select-shell">
        <select id="prep-select">
          <option value="0">None</option>
          <option value="10">10 seconds</option>
          <option value="20">20 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60">1 minute</option>
        </select>
      </span>
    </label>
    <p class="sheet-note">A pause before the clock starts, to get seated.</p>

    <button class="pill cta sheet-done">Done</button>
  </section>

  <section id="sound-sheet" class="sheet" role="dialog" aria-modal="true"
           aria-label="Sound" hidden>
    <h2 class="sheet-title">Sound</h2>

    <label class="sheet-row hidden" id="s-ambience-field">
      <span class="sheet-label">Ambience</span>
      <span class="select-shell">
        <select id="s-ambience-select">
          <option value="off">Off</option>
          <option value="on">On</option>
        </select>
      </span>
    </label>

    <label class="sheet-row">
      <span class="sheet-label">Music</span>
      <span class="select-shell">
        <select id="s-music-select"></select>
      </span>
    </label>

    <button class="pill cta sheet-done">Done</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
